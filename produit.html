<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12181A">
<meta property="og:type" content="website">
<meta property="og:title" content="QuickShop">
<meta property="og:description" content="تسوق بسهولة وادفع عند الاستلام">
<meta property="og:image" content="">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">

<title>QuickShop — المنتج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F3F1ED; --card:#FFFFFF; --ink:#171A1C; --ink-soft:#6C7278;
  --teal:#1F4B4C; --teal-dark:#163736; --teal-tint:#DCE8E6;
  --amber:#E08A3C; --amber-tint:#FBE6D2;
  --line:#E3E0D8; --nav-dark:#12181A; --nav-dark-2:#1B2325; --cream:#F3F1ED;
  --danger:#D6432F; --warn:#F59E0B; --warn-light:#FFFBEB;
  --shadow:0 2px 10px rgba(23,26,28,.06);
  --shadow-md:0 4px 16px rgba(23,26,28,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:90px;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
img{display:block;max-width:100%;}
a{text-decoration:none;color:inherit;}

/* ANNOUNCE */
.announce{background:var(--nav-dark);color:var(--cream);text-align:center;font-size:12.5px;font-weight:600;padding:9px 16px;letter-spacing:.2px;}

/* HEADER */
.header{background:var(--nav-dark);position:sticky;top:0;z-index:60;border-bottom:1px solid rgba(243,241,237,0.08);}
.header-inner{display:flex;align-items:center;gap:12px;padding:12px 15px;max-width:640px;margin:0 auto;}
.back-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--cream);flex-shrink:0;}
.logo{font-weight:800;font-size:20px;color:var(--cream);flex:1;display:flex;align-items:center;gap:6px;}
.logo span{color:var(--amber);}
.header-cta{background:var(--amber);color:var(--nav-dark);font-size:11.5px;font-weight:800;padding:8px 14px;border-radius:999px;opacity:0;transform:scale(.92);pointer-events:none;transition:.2s;white-space:nowrap;flex-shrink:0;}
.header-cta.show{opacity:1;transform:scale(1);pointer-events:auto;}

/* GALLERY */
.gallery{background:var(--card);position:relative;overflow:hidden;}
.gallery-track{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  width:100%;
  max-width:500px;
  margin:0 auto;
}
.gallery-track::-webkit-scrollbar{display:none;}
.gallery-slide{
  flex:0 0 100%;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  display:flex;
  justify-content:center;
  align-items:center;
}
.gallery-img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:contain;
  object-position:center;
  background:#fff;
  display:block;
  margin:0 auto;
  pointer-events:none;
  -webkit-user-select:none;
  user-select:none;
}
.gallery-dots{
  position:absolute;
  bottom:10px;
  left:0;right:0;
  display:flex;
  justify-content:center;
  gap:6px;
  pointer-events:none;
}
.gallery-dots .gdot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(23,26,28,.22);
  transition:.2s;
}
.gallery-dots .gdot.active{
  background:var(--teal-dark);
  width:16px;border-radius:4px;
}

/* PRODUCT INFO */
.pinfo{background:var(--card);padding:16px 15px 14px;border-bottom:1px solid var(--line);max-width:640px;margin:0 auto;}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
.pbadge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.3px;}
.pbadge-cat{background:var(--teal-tint);color:var(--teal-dark);}
.pbadge-promo{background:var(--amber);color:#12181A;}
.ptitle{font-size:20px;font-weight:800;line-height:1.3;color:var(--ink);}
.pprices{display:flex;align-items:baseline;gap:9px;margin-top:10px;flex-wrap:wrap;}
.price-now{font-size:25px;font-weight:800;color:var(--teal);}
.price-old{font-size:14px;color:var(--ink-soft);text-decoration:line-through;}
.discount-badge{background:var(--amber-tint);color:#7A4D1A;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;}

/* BUNDLES */
.bundles-section{background:var(--card);padding:14px 15px;border-bottom:1px solid var(--line);max-width:640px;margin:0 auto;}
.bundles-title{font-size:13.5px;font-weight:800;margin-bottom:10px;color:var(--ink);}
.bundles-grid{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.bundles-grid::-webkit-scrollbar{display:none;}
.bundle-btn{flex-shrink:0;min-width:90px;padding:10px 8px;border-radius:13px;border:2px solid var(--line);background:var(--bg);cursor:pointer;text-align:center;transition:.15s;font-family:inherit;}
.bundle-btn.active{border-color:var(--teal);background:var(--teal-tint);}
.bundle-qty{font-size:12.5px;font-weight:800;color:var(--ink);display:block;}
.bundle-price{font-size:14px;font-weight:900;color:var(--teal-dark);display:block;margin-top:2px;}
.bundle-save{font-size:10px;color:var(--amber);font-weight:700;display:block;margin-top:1px;}

/* VARIANTS */
.variants-section{background:var(--card);padding:14px 15px;border-bottom:1px solid var(--line);max-width:640px;margin:0 auto;}
.variant-type-title{font-size:13.5px;font-weight:800;margin-bottom:9px;color:var(--ink);}
.variant-type-block{margin-bottom:14px;}
.variant-type-block:last-child{margin-bottom:0;}
.variants-grid{display:flex;gap:8px;flex-wrap:wrap;}
.variant-opt-btn{padding:9px 16px;border-radius:10px;border:2px solid var(--line);background:var(--bg);cursor:pointer;text-align:center;transition:.15s;font-family:inherit;font-size:13px;font-weight:700;}
.variant-opt-btn.active{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-dark);}
.variant-opt-btn.oos{opacity:.5;cursor:not-allowed;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 4px,var(--line) 4px,var(--line) 5px);display:flex;flex-direction:column;align-items:center;gap:2px;}
.variant-opt-btn.oos .oos-tag{font-size:9px;font-weight:800;color:var(--danger);text-transform:uppercase;}

/* ORDER FORM */
.order-section{background:var(--card);margin:12px;border-radius:18px;box-shadow:var(--shadow-md);border:2px solid var(--teal-tint);max-width:616px;margin-left:auto;margin-right:auto;}
.order-header{background:linear-gradient(135deg,var(--teal-dark),var(--teal));padding:14px 16px;border-radius:16px 16px 0 0;text-align:center;}
.order-header-title{font-size:14.5px;font-weight:800;color:#fff;}
.order-header-sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px;}
.order-body{padding:15px;}
.field{margin-bottom:12px;}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:5px;}
.field input,.field select{width:100%;padding:11px 13px;border-radius:11px;border:2px solid var(--line);font-size:14px;background:var(--bg);color:var(--ink);transition:.2s;-webkit-appearance:none;appearance:none;}
.field input:focus,.field select:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(31,75,76,.12);}
.field input.error{border-color:var(--danger);}
.field-error{font-size:11px;color:var(--danger);margin-top:4px;font-weight:700;}
.field-row{display:flex;gap:9px;}
.field-row .field{flex:1;min-width:0;}

/* DELIVERY TYPE */
.del-type-row{display:flex;gap:9px;margin-bottom:12px;}
.del-type-btn{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:13px;padding:11px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;font-family:inherit;}
.del-type-btn.active{border-color:var(--teal);background:var(--teal-tint);}
.del-type-icon{font-size:21px;}
.del-type-label{font-size:12px;font-weight:700;color:var(--ink);}
.del-type-price{font-size:13px;font-weight:900;color:var(--teal-dark);}

/* QTY */
.qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:11px;padding:8px 12px;margin-bottom:12px;border:2px solid var(--line);}
.qty-label{font-size:13px;font-weight:700;}
.qty-ctrl{display:flex;align-items:center;gap:11px;}
.qty-btn{width:44px;height:44px;border-radius:9px;background:#fff;border:2px solid var(--line);font-size:17px;font-weight:700;color:var(--teal-dark);display:flex;align-items:center;justify-content:center;transition:.15s;}
.qty-btn:active{transform:scale(.92);}
.qty-val{width:28px;text-align:center;font-size:16px;font-weight:800;}

/* TOTAL */
.total-box{background:var(--teal-tint);border-radius:13px;padding:12px 15px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;border:1.5px solid rgba(31,75,76,.2);}
.total-label{font-size:12.5px;color:var(--teal-dark);font-weight:600;}
.total-val{font-size:21px;font-weight:900;color:var(--teal-dark);}

/* FAST WARNING */
.fast-warning{background:var(--warn-light);border:1.5px solid var(--warn);border-radius:10px;padding:9px 12px;margin-bottom:11px;font-size:12px;color:#92400E;font-weight:700;display:none;}

/* SUBMIT */
.submit-btn{width:100%;padding:14px;border-radius:13px;background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;font-size:15.5px;font-weight:800;box-shadow:0 6px 18px rgba(22,55,54,.3);display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s;letter-spacing:.2px;}
.submit-btn:active{transform:scale(.98);}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;}

/* SUCCESS */
.success-box{text-align:center;padding:28px 15px;}
.success-icon{font-size:52px;margin-bottom:11px;}
.success-title{font-size:18px;font-weight:800;color:var(--teal-dark);}
.success-sub{font-size:13.5px;color:var(--ink-soft);margin-top:7px;line-height:1.7;}

/* DESCRIPTION */
.desc-section{background:var(--card);padding:18px 15px;border-top:8px solid var(--bg);max-width:640px;margin:0 auto;}
.desc-title{font-size:15px;font-weight:800;margin-bottom:11px;color:var(--ink);}
.desc-text{font-size:13.5px;line-height:1.8;color:var(--ink-soft);direction:rtl;}
.feature-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
.feature-item{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.6;}
.feature-check{width:20px;height:20px;border-radius:6px;background:var(--teal-tint);color:var(--teal-dark);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}

/* SIMILAR PRODUCTS STRIP */
.related-section{padding:0 0 24px;overflow:hidden;background:var(--bg);}
.related-header{display:flex;align-items:center;justify-content:space-between;padding:20px 15px 10px;max-width:640px;margin:0 auto;}
.related-title{font-size:15px;font-weight:800;color:var(--ink);}
.related-badge{font-size:11px;font-weight:700;background:var(--amber-tint);color:#7A4D1A;padding:3px 9px;border-radius:999px;}
.similar-strip{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 15px 10px;
}
.similar-strip::-webkit-scrollbar{display:none;}
.rcard{
  flex:0 0 138px;
  scroll-snap-align:start;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  border:1.5px solid var(--line);
  box-shadow:var(--shadow);
  display:block;
  transition:transform .15s ease;
}
.rcard:active{transform:scale(.96);}
.rcard-img-wrap{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--bg);}
.rcard-img{width:100%;height:100%;object-fit:cover;}
.rcard-cat-tag{position:absolute;top:6px;right:6px;background:var(--teal);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;}
.rcard-body{padding:8px 9px 10px;}
.rcard-name{font-size:11.5px;font-weight:700;line-height:1.35;max-height:2.7em;overflow:hidden;color:var(--ink);}
.rcard-price{font-size:13px;font-weight:900;color:var(--teal-dark);margin-top:4px;}
.rcard-old{font-size:10px;color:var(--ink-soft);text-decoration:line-through;margin-top:1px;}
.rcard-viewall{
  flex:0 0 100px;
  scroll-snap-align:start;
  background:var(--teal);
  border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#fff;font-size:11px;font-weight:800;text-align:center;padding:12px 8px;
}
.rcard-viewall .va-icon{font-size:22px;}

/* STICKY BOTTOM */
.sticky-bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(243,241,237,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 15px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:11px;transform:translateY(100%);transition:transform .25s ease;box-shadow:0 -6px 20px rgba(23,26,28,.08);}
.sticky-bottom.show{transform:translateY(0);}
.sticky-prices{flex-shrink:0;}
.sticky-price-now{font-size:16px;font-weight:900;color:var(--teal-dark);display:block;}
.sticky-price-old{font-size:10.5px;color:var(--ink-soft);text-decoration:line-through;}
.sticky-cta{flex:1;background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;font-size:14.5px;font-weight:800;padding:12px;border-radius:12px;text-align:center;box-shadow:0 4px 14px rgba(22,55,54,.25);cursor:pointer;}

/* LOADING */
.loading-state{text-align:center;padding:70px 20px;color:var(--ink-soft);}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:640px){
  .order-section,.pinfo,.bundles-section,.desc-section,.related-section{max-width:600px;margin-left:auto;margin-right:auto;}
  .order-section{margin-top:14px;}
}
</style>
</head>
<body>

<div class="announce">⚡ توصيل خلال 48 ساعة &nbsp;·&nbsp; <span style="font-weight:800">الدفع عند الاستلام</span></div>

<header class="header">
  <div class="header-inner">
    <a href="javascript:void(0)" onclick="window.location.href=window.location.origin+'/'" class="back-btn">←</a>

<script>
/* ===================== UTM CROSS-PAGE PERSISTENCE ===================== */
(function persistUTM(){
  const p = new URLSearchParams(location.search);
  const keys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','ttclid','gclid'];
  const utm = {};
  keys.forEach(k=>{ if(p.get(k)) utm[k]=p.get(k); });
  if(Object.keys(utm).length) try{ sessionStorage.setItem('qs_utm', JSON.stringify(utm)); }catch(e){}
})();

/* ===================== XSS SANITIZATION ===================== */
function esc(str) {
  if(!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function detectOrderSource(){
  const params=new URLSearchParams(window.location.search);
  const ref=document.referrer||'';
  const utm=(params.get('utm_source')||'').toLowerCase();
  if(utm==='facebook'||utm==='instagram'||utm==='meta') return 'meta';
  if(params.has('fbclid')||ref.includes('facebook.com')||ref.includes('fb.com')) return 'meta';
  if(ref.includes('instagram.com')) return 'meta';
  if(utm==='tiktok') return 'tiktok';
  if(params.has('ttclid')||ref.includes('tiktok.com')) return 'tiktok';
  if(utm==='google'||params.has('gclid')||ref.includes('google.')) return 'google';
  try {
    const stored = JSON.parse(sessionStorage.getItem('qs_utm')||'{}');
    if(stored.utm_source){
      const s=stored.utm_source.toLowerCase();
      if(s==='facebook'||s==='instagram'||s==='fb') return 'meta';
      if(s==='google'||s==='cpc') return 'google';
      if(s==='tiktok') return 'tiktok';
      return s;
    }
    if(stored.fbclid) return 'facebook';
    if(stored.ttclid) return 'tiktok';
    if(stored.gclid) return 'google';
  } catch(e){}
  return 'organic';
}

function getDeliveryPrice(p,s,wilaya,type){
  const isStop=type==='bureau';
  const byW=isStop?(s.byWilayaStopdesk||{}):(s.byWilaya||{});
  if(p.deliveryEnabled){
    const pByW=isStop?p.deliveryByWilayaStopdesk:p.deliveryByWilaya;
    if(wilaya&&pByW&&pByW[wilaya]!=null) return Number(pByW[wilaya]);
    const pP=isStop?p.deliveryPriceStopdesk:p.deliveryPrice;
    if(pP!=null) return Number(pP);
  }
  if(wilaya&&byW[wilaya]!=null) return Number(byW[wilaya]);
  return Number(isStop?(s.defaultPriceStopdesk||0):(s.defaultPrice||0));
}
function validatePhone(phone){
  const c=phone.replace(/\s+/g,'');
  if(!/^[0-9]{10}$/.test(c)) return 'رقم الهاتف يجب أن يكون 10 أرقام';
  if(!/^0[567]/.test(c)) return 'يجب أن يبدأ بـ 05 أو 06 أو 07';
  return null;
}

function fireAddToCart(product, qty) {
  const price = SELECTED_VARIANT_PRICE || product.priceNew || 0;
  if(typeof fbq !== 'undefined') {
    fbq('track','AddToCart',{
      content_ids:[product.id],
      content_name:product.name,
      content_type:'product',
      value:price * qty,
      currency:'DZD'
    });
  }
  if(typeof ttq !== 'undefined') {
    ttq.track('AddToCart',{
      content_id:product.id,
      content_name:product.name,
      price:price,
      currency:'DZD',
      quantity:qty
    });
  }
}

function updateOGTags(p) {

    if(el) el.setAttribute('content', val);
  };
  document.title = `${p.name} — QuickShop`;
  setMeta('og:title', `${p.name} — QuickShop`);
  setMeta('og:description', p.description || 'تسوق بسهولة وادفع عند الاستلام');

/* ===================== GALLERY ===================== */
function setupGallery(count){
  if(count<2)return;
  const track=document.getElementById('galleryTrack');
  const dotsWrap=document.getElementById('galleryDots');
  if(!track||!dotsWrap)return;
  const dots=dotsWrap.querySelectorAll('.gdot');
  let ticking=false;
  track.addEventListener('scroll',()=>{
    if(ticking)return;
    ticking=true;
    requestAnimationFrame(()=>{
      const w=track.clientWidth;
      let sl=Math.abs(track.scrollLeft);
      const idx=Math.round(sl/w);
      dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
      ticking=false;
    });
  },{passive:true});
}

/* ===================== BUNDLES ===================== */
function setupBundles(p,settings){
  document.querySelectorAll('.bundle-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.bundle-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      SELECTED_BUNDLE={qty:Number(btn.dataset.qty),price:Number(btn.dataset.price)};
      QTY=SELECTED_BUNDLE.qty;
      document.getElementById('qtyVal').textContent=QTY;
      const w=document.getElementById('fWilaya').value;
      updateTotals(p,w?getDeliveryPrice(p,_deliverySettings,w,DELIVERY_TYPE):0);
    });
  });
  if(p.bundles.length){SELECTED_BUNDLE=p.bundles[0];QTY=SELECTED_BUNDLE.qty;document.getElementById('qtyVal').textContent=QTY;}
}

/* ===================== VARIANTS ===================== */
function setupVariants(p){
  document.querySelectorAll('.variant-opt-btn').forEach(btn=>{
    if(btn.classList.contains('oos'))return;
    btn.addEventListener('click',()=>{
      const vi=Number(btn.dataset.vi);
      document.querySelectorAll(`.variant-opt-btn[data-vi="${vi}"]`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const vt=p.variants[vi];
      SELECTED_VARIANT_LABELS[vt.name]=vt.options[Number(btn.dataset.oi)].value;
      if(btn.dataset.price) SELECTED_VARIANT_PRICE=Number(btn.dataset.price);
      const w=document.getElementById('fWilaya').value;
      updateTotals(p,w?getDeliveryPrice(p,_deliverySettings,w,DELIVERY_TYPE):0);
    });
  });
  p.variants.forEach((v,vi)=>{
    const fa=(v.options||[]).findIndex(o=>!o.outOfStock);
    if(fa>-1){
      const opt=v.options[fa];
      SELECTED_VARIANT_LABELS[v.name]=opt.value;
      if(vi===p.variants.length-1&&opt.price) SELECTED_VARIANT_PRICE=Number(opt.price);
      const btn=document.querySelector(`.variant-opt-btn[data-vi="${vi}"][data-oi="${fa}"]`);
      if(btn) btn.classList.add('active');
    }
  });
}

/* ===================== TOTALS ===================== */
function updateTotals(p,deliveryPrice){
  const unitPrice=SELECTED_BUNDLE?null:(SELECTED_VARIANT_PRICE!=null?SELECTED_VARIANT_PRICE:p.priceNew);
  const productTotal=SELECTED_BUNDLE?SELECTED_BUNDLE.price:unitPrice*QTY;
  const total=productTotal+deliveryPrice;
  const typeLabel=DELIVERY_TYPE==='bureau'?'توصيل للمكتب':'توصيل للمنزل';
  document.getElementById('totalLabel').textContent=`المجموع + ${typeLabel} (${fmt(deliveryPrice)} دج)`;
  document.getElementById('totalVal').textContent=fmt(total)+' دج';
  const priceNow=SELECTED_BUNDLE?SELECTED_BUNDLE.price:(SELECTED_VARIANT_PRICE!=null?SELECTED_VARIANT_PRICE:p.priceNew);
  document.getElementById('stickyPriceNow').textContent=fmt(priceNow)+' دج';
}

function buildWilayaOptions(settings){
  const sel=document.getElementById('fWilaya');
  if(!sel)return;
  const current=sel.value;
  sel.innerHTML='<option value="">اختر الولاية</option>'+
    WILAYAS.filter(w=>{
      const hd=(settings.disabledHomeWilayas||[]).includes(w);
      const sd=(settings.disabledStopdeskWilayas||[]).includes(w);
      return !(hd&&sd);
    }).map(w=>`<option value="${w}" ${w===current?'selected':''}>${w}</option>`).join('');
}

/* ===================== FORM ===================== */
function setupForm(p,settings){
  _deliverySettings=settings;
  buildWilayaOptions(settings);
  const wSel=document.getElementById('fWilaya');
  const cSel=document.getElementById('fCommune');

  updateTotals(p,0);

  function applyWilayaRestrictions(w){
    if(!w){ document.getElementById('btnBureau').style.display='flex'; document.getElementById('btnHome').style.display='flex'; return; }
    const sd=(settings.disabledStopdeskWilayas||[]).includes(w);
    const hd=(settings.disabledHomeWilayas||[]).includes(w);
    document.getElementById('btnBureau').style.display=sd?'none':'flex';
    document.getElementById('btnHome').style.display=hd?'none':'flex';
    if(sd&&DELIVERY_TYPE==='bureau'){ DELIVERY_TYPE='home'; document.getElementById('btnHome').classList.add('active'); document.getElementById('btnBureau').classList.remove('active'); }
    if(hd&&DELIVERY_TYPE==='home'){ DELIVERY_TYPE='bureau'; document.getElementById('btnBureau').classList.add('active'); document.getElementById('btnHome').classList.remove('active'); }
  }

  wSel.addEventListener('change',function(){
    const w=this.value;
    fillCommuneSelect('fCommune',w,'');
    applyWilayaRestrictions(w);
    const dp=w?getDeliveryPrice(p,settings,w,DELIVERY_TYPE):0;
    const dh=w?getDeliveryPrice(p,settings,w,'home'):0;
    const ds=w?getDeliveryPrice(p,settings,w,'bureau'):0;
    document.getElementById('dtHome').textContent=w?fmt(dh)+' دج':'اختر الولاية';
    document.getElementById('dtBureau').textContent=w?fmt(ds)+' دج':'اختر الولاية';
    document.getElementById('dtHome').style.cssText='font-size:13px;font-weight:900;color:var(--teal-dark);';
    document.getElementById('dtBureau').style.cssText='font-size:13px;font-weight:900;color:var(--teal-dark);';
    updateTotals(p,dp);
  });

  document.getElementById('btnHome').addEventListener('click',()=>{
    DELIVERY_TYPE='home';
    document.getElementById('btnHome').classList.add('active');
    document.getElementById('btnBureau').classList.remove('active');
    updateTotals(p,wSel.value?getDeliveryPrice(p,settings,wSel.value,'home'):0);
    scheduleAbandonedSave(p);
  });
  document.getElementById('btnBureau').addEventListener('click',()=>{
    DELIVERY_TYPE='bureau';
    document.getElementById('btnBureau').classList.add('active');
    document.getElementById('btnHome').classList.remove('active');
    updateTotals(p,wSel.value?getDeliveryPrice(p,settings,wSel.value,'bureau'):0);
    scheduleAbandonedSave(p);
  });

  document.getElementById('qtyMinus').addEventListener('click',()=>{
    if(SELECTED_BUNDLE)return;
    if(QTY>1){QTY--;document.getElementById('qtyVal').textContent=QTY;updateTotals(p,wSel.value?getDeliveryPrice(p,settings,wSel.value,DELIVERY_TYPE):0);scheduleAbandonedSave(p);}
  });
  document.getElementById('qtyPlus').addEventListener('click',()=>{
    if(SELECTED_BUNDLE)return;
    if(QTY < 10) QTY++;document.getElementById('qtyVal').textContent=QTY;updateTotals(p,wSel.value?getDeliveryPrice(p,settings,wSel.value,DELIVERY_TYPE):0);scheduleAbandonedSave(p);
  });

  ['fName','fPhone'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>scheduleAbandonedSave(p));});
  cSel.addEventListener('change',()=>scheduleAbandonedSave(p));

  const scrollToForm=()=>{
    fireAddToCart(p, QTY);
    document.getElementById('orderCard').scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>document.getElementById('fName').focus({preventScroll:true}),400);
  };
  document.getElementById('headerCta').addEventListener('click',scrollToForm);
  document.getElementById('stickyCtaBtn').addEventListener('click',scrollToForm);
  document.getElementById('submitBtn').addEventListener('click',()=>submitOrder(p));
}

async function submitOrder(p){
  const name=document.getElementById('fName').value.trim();

function buildWALink(order) {
  const msg = encodeURIComponent(
    `مرحبا، لقد أتممت طلبي:\n` +
    `📦 ${order.product_name}\n` +
    `👤 ${order.name}\n` +
    `📞 ${order.phone}\n` +
    `📍 ${order.wilaya}\n` +
    `💰 ${order.total} دج\n` +
    `🆔 #${order.id.slice(-6).toUpperCase()}`
  );
  const storePhone = (window.APP_SETTINGS?.whatsapp||window.APP_SETTINGS?.phone||'').replace(/\D/g,'');
  if(!storePhone) return null;
  return `https://wa.me/${storePhone}?text=${msg}`;
}

/* ===================== NOTIFY SERVER (GSHEETS) ===================== */
async function notifyServer(data,type){
  try{
    const {data:s}=await sb.from('app_settings').select('gsheets_enabled,gsheets_sheet_id,gsheets_cols_orders,gsheets_abandoned_enabled,gsheets_abandoned_sheet_id,gsheets_cols_abandoned').eq('id',1).single();
    if(!s)return;
    const ALL_COLS_ORDERS=['date','name','phone','wilaya','commune','product','qty','unit_price','delivery','total','delivery_type','status','source','confirmateur','tracking','id'];
    const ALL_COLS_LABELS={'date':'التاريخ','name':'الاسم','phone':'الهاتف','wilaya':'الولاية','commune':'البلدية','product':'المنتج','qty':'الكمية','unit_price':'سعر الوحدة','delivery':'التوصيل','total':'المجموع','delivery_type':'نوع التوصيل','status':'الحالة','source':'المصدر','confirmateur':'المؤكد','tracking':'رقم التتبع','id':'ID'};
    const ALL_COLS_ABAND=['date','name','phone','wilaya','commune','product','qty','total','source','status','id'];
    const ALL_LABELS_ABAND={'date':'التاريخ','name':'الاسم','phone':'الهاتف','wilaya':'الولاية','commune':'البلدية','product':'المنتج','qty':'الكمية','total':'المجموع','source':'المصدر','status':'الحالة','id':'ID'};
    function buildRow(d,cols){
      return cols.map(k=>{
        switch(k){
          case 'date':return new Date(Number(d.created_at||d.updated_at||Date.now())).toLocaleString('fr-FR');
          case 'name':return d.name||'';case 'phone':return d.phone||'';case 'wilaya':return d.wilaya||'';
          case 'commune':return d.commune||'';case 'product':return d.product_name||'';case 'qty':return d.qty||1;
          case 'unit_price':return d.unit_price||0;case 'delivery':return d.delivery_price||0;case 'total':return d.total||0;
          case 'delivery_type':return d.delivery_type==='stopdesk'?'مكتب':'منزل';
          case 'status':return d.status||'new';case 'source':return d.order_source||'organic';
          case 'confirmateur':return d.assigned_to||'';case 'tracking':return d.noest_tracking||'';case 'id':return d.id||'';
          default:return '';
        }
      });
    }
    if(type==='order'&&s.gsheets_enabled&&s.gsheets_sheet_id){
      const cols=s.gsheets_cols_orders?JSON.parse(s.gsheets_cols_orders):ALL_COLS_ORDERS;
      const headers=cols.map(k=>ALL_COLS_LABELS[k]||k);
      fetch(s.gsheets_sheet_id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({headers,row:buildRow(data,cols),type:'order'})}).catch(()=>{});
    }
    if(type==='abandoned'&&s.gsheets_abandoned_enabled&&s.gsheets_abandoned_sheet_id){
      const cols=s.gsheets_cols_abandoned?JSON.parse(s.gsheets_cols_abandoned):ALL_COLS_ABAND;
      const headers=cols.map(k=>ALL_LABELS_ABAND[k]||k);
      fetch(s.gsheets_abandoned_sheet_id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({headers,row:buildRow(data,cols),type:'abandoned'})}).catch(()=>{});
    }
  }catch(e){console.log('Sheets notify error:',e);}
}

/* ===================== ABANDONED CART ===================== */
function scheduleAbandonedSave(p){
  if(orderPlaced)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveAbandonedCart(p),1500);
}
async function saveAbandonedCart(p){
  if(orderPlaced)return;
  const name=document.getElementById('fName')?.value.trim()||'';
  const phone=document.getElementById('fPhone')?.value.trim().replace(/\s+/g,'')||'';
  const wilaya=document.getElementById('fWilaya')?.value||'';
  const commune=document.getElementById('fCommune')?.value||'';
  if(!phone||phone.replace(/\D/g,'').length<9)return;
  if(!cartSnapshotKey) cartSnapshotKey='aband_'+uid();
  const abandUnitPrice=SELECTED_BUNDLE?null:(SELECTED_VARIANT_PRICE!=null?SELECTED_VARIANT_PRICE:p.priceNew);
  const abandVariantSuffix=Object.keys(SELECTED_VARIANT_LABELS).length
    ? ' ('+Object.entries(SELECTED_VARIANT_LABELS).map(([k,v])=>`${k}: ${v}`).join(', ')+')'
    : '';
  const abandDeliveryPrice=wilaya?getDeliveryPrice(p,_deliverySettings,wilaya,DELIVERY_TYPE):0;
  const abandProductTotal=SELECTED_BUNDLE?SELECTED_BUNDLE.price:abandUnitPrice*QTY;
  const row={
    id:cartSnapshotKey,product_id:p.id,product_name:p.name+abandVariantSuffix,
    product_image:(p.images&&p.images[0])||p.image||'',
    name,phone,wilaya,commune,qty:QTY,
    variant:Object.values(SELECTED_VARIANT_LABELS).pop()||null,
    delivery_price:abandDeliveryPrice,total:abandProductTotal+abandDeliveryPrice,
    delivery_type:DELIVERY_TYPE==='bureau'?'stopdesk':DELIVERY_TYPE,
    order_source:ORDER_SOURCE,customer_ip:CUSTOMER_IP,updated_at:Date.now()
  };
  const {error}=await sb.from('abandoned_carts').upsert(row);
  if(!error) notifyServer(row,'abandoned');
}
async function removeAbandonedCart(){
  if(cartSnapshotKey){ await sb.from('abandoned_carts').delete().eq('id',cartSnapshotKey); }
  const phone=document.getElementById('fPhone')?.value.trim().replace(/\s+/g,'');
  if(phone&&phone.length>=9){
    await sb.from('abandoned_carts').delete().eq('phone',phone).eq('product_id',PRODUCT?.id||'');
  }
}

/* ===================== STICKY ===================== */
function setupSticky(){
  const card=document.getElementById('orderCard');
  const sticky=document.getElementById('stickyBottom');
  const hCta=document.getElementById('headerCta');
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(orderPlaced){sticky.classList.remove('show');hCta.classList.remove('show');return;}
      if(e.isIntersecting){sticky.classList.remove('show');hCta.classList.remove('show');}
      else{
        const r=e.boundingClientRect;
        if(r.top<0){hCta.classList.add('show');sticky.classList.remove('show');}
        else{sticky.classList.add('show');hCta.classList.remove('show');}
      }
    });
  },{threshold:0.15});
  io.observe(card);
}

/* ===================== SIMILAR PRODUCTS STRIP ===================== */
function renderRelated(current, all){
  const zone=document.getElementById('relatedZone');
  if(!zone) return;
  const others=all.filter(p=>p.id!==current.id&&p.active!==false);
  if(!others.length){ zone.innerHTML=''; return; }
  const shuffle=a=>a.sort(()=>Math.random()-.5);
  const samecat=shuffle(others.filter(p=>p.category&&p.category===current.category));
  const rest=shuffle(others.filter(p=>!p.category||p.category!==current.category));
  const list=[...samecat,...rest].slice(0,8);
  const cards=list.map(p=>{
    const img=(p.images&&p.images[0])||p.image||'';
    const catTag=p.category?`<div class="rcard-cat-tag">${esc(p.category)}</div>`:'';
    const oldPrice=p.priceOld?`<div class="rcard-old">${fmt(p.priceOld)} دج</div>`:'';
    return `<a class="rcard" href="produit.html?id=${encodeURIComponent(p.id)}">
      <div class="rcard-img-wrap">${img?`<img class="rcard-img" src="${img}" alt="${esc(p.name)}" loading="lazy">`:''}${catTag}</div>
      <div class="rcard-body"><div class="rcard-name">${esc(p.name)}</div><div class="rcard-price">${fmt(p.priceNew)} دج</div>${oldPrice}</div>
    </a>`;
  }).join('');
  const viewAll=`<a class="rcard-viewall" href="/"><div class="va-icon">🛍️</div><div>كل المنتجات</div></a>`;
  const badge=samecat.length?'منتجات مشابهة':'قد يعجبك أيضاً';
  zone.innerHTML=`
    <div class="related-header">
      <div class="related-title">قد يعجبك أيضاً ✨</div>
      <div class="related-badge">${badge}</div>
    </div>
    <div class="similar-strip">${cards}${viewAll}</div>`;
}

/* ===================== INIT ===================== */
(async function init(){
  initPixels();
  const id=qs('id');
  const [products,settings]=await Promise.all([
    loadProducts(),
    loadDeliverySettings(),
    (async()=>{
      try{
        const {data}=await sb.from('app_settings').select('whatsapp,phone').eq('id',1).single();
        if(data) window.APP_SETTINGS=data;
      }catch(e){}
    })()
  ]);
  let product=products.find(p=>p.id===id);
  if(!product&&products.length) product=products[0];
  if(!product){
    document.getElementById('appRoot').innerHTML=`<div class="loading-state">المنتج غير موجود.<br><a href="/" style="color:var(--teal);font-weight:800;">← العودة للمتجر</a></div>`;
    return;
  }
  PRODUCT=product;
  renderProduct(product,settings);
  renderRelated(product,products);
  trackViewContent(product);
  window.addEventListener('beforeunload',()=>{if(!orderPlaced)saveAbandonedCart(product);});
  setTimeout(()=>{
    const fz=document.getElementById('orderFormZone');
    if(fz&&!orderPlaced) fz.scrollIntoView({behavior:'smooth',block:'center'});
  },2500);
})();
</script>
