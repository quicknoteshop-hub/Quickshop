<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F4B4C">
<title>QuickShop — منتج</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F3F1ED; --bg-card:#FFFFFF; --ink:#171A1C; --ink-soft:#6C7278;
  --teal:#1F4B4C; --teal-dark:#163736; --teal-tint:#DCE8E6;
  --amber:#E08A3C; --amber-tint:#FBE6D2;
  --line:#E3E0D8; --nav-dark:#12181A; --cream:#F3F1ED;
  --danger:#D6432F;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;padding-bottom:90px;}
img{display:block;max-width:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}

/* ── Top bar ── */
.topbar{
  position:sticky;top:0;z-index:50;background:#fff;
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-bottom:1.5px solid var(--line);box-shadow:0 2px 10px rgba(18,24,26,.06);
}
.topbar-back{
  width:36px;height:36px;border-radius:50%;background:var(--teal-tint);
  color:var(--teal-dark);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.topbar-logo img{height:30px;border-radius:6px;}
.topbar-name{
  flex:1;font-size:13.5px;font-weight:800;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ── Gallery ── */
.gallery-wrap{position:relative;background:var(--teal-tint);width:100%;}
.gallery-scroll{
  display:flex;overflow-x:scroll;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;direction:ltr;
  aspect-ratio:4/3;
}
.gallery-scroll::-webkit-scrollbar{display:none;}
.gallery-scroll img{
  flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;
  pointer-events:none; user-select:none; -webkit-user-select:none;
  -webkit-touch-callout:none;
}
.gallery-scroll .placeholder{
  flex:0 0 100%;display:flex;align-items:center;justify-content:center;
  font-size:64px;background:var(--teal-tint);
}
.gallery-dots{
  position:absolute;bottom:12px;left:0;right:0;
  display:flex;justify-content:center;gap:7px;z-index:2;
}
.gallery-dots button{
  width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);
  border:none;padding:0;transition:.25s;
}
.gallery-dots button.active{background:#fff;width:20px;border-radius:4px;}
.gallery-count{
  position:absolute;top:10px;right:10px;
  background:rgba(0,0,0,.42);color:#fff;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:999px;z-index:3;
}

/* ── Price hero ── */
.price-hero{
  background:linear-gradient(135deg,var(--teal) 0%,var(--teal-dark) 100%);
  color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
}
.price-hero .p-now{font-size:26px;font-weight:800;}
.price-hero .p-old{font-size:13px;color:rgba(255,255,255,.65);text-decoration:line-through;font-weight:600;margin-inline-start:8px;}
.price-hero .p-badge{
  background:var(--amber);color:#12181A;font-size:11px;font-weight:800;
  padding:5px 11px;border-radius:999px;white-space:nowrap;
}

/* ── Info block (badge + name only) ── */
.info{padding:16px 16px 10px;}
.product-badge{
  display:inline-block;background:var(--amber);color:#12181A;
  font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:8px;
}
.product-name{font-size:20px;font-weight:800;margin-bottom:8px;line-height:1.35;}
/* description + features moved below form — see .desc-section */

/* ── Variants ── */
.variant-block{margin-bottom:14px;padding:0 16px;}
.variant-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
.variant-opts{display:flex;gap:8px;flex-wrap:wrap;}
.variant-opt{
  padding:9px 16px;border-radius:999px;border:2px solid var(--line);
  font-size:13px;font-weight:700;cursor:pointer;background:#fff;transition:.15s;
}
.variant-opt.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.variant-opt.oos{opacity:.4;text-decoration:line-through;cursor:not-allowed;}

/* ── Qty ── */
.qty-wrap{padding:0 16px;margin-bottom:14px;}
.qty-row{
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;border-radius:12px;padding:10px 14px;border:2px solid var(--line);
}
.qty-label{font-size:13px;font-weight:700;}
.qty-ctrl{display:flex;align-items:center;gap:12px;}
.qty-btn{
  min-width:42px;height:42px;border-radius:9px;background:var(--bg);
  border:2px solid var(--line);font-size:20px;font-weight:700;
  color:var(--teal-dark);display:flex;align-items:center;justify-content:center;transition:.15s;
}
.qty-btn:active{background:var(--teal-tint);}
.qty-val{width:28px;text-align:center;font-size:18px;font-weight:800;color:var(--teal);}

/* ── Bundles ── */
.bundle-wrap{padding:0 16px;margin-bottom:14px;}
.bundle-opt{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;border:2px solid var(--line);border-radius:12px;
  margin-bottom:8px;cursor:pointer;font-size:13px;font-weight:700;
  background:#fff;transition:.15s;
}
.bundle-opt.active{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-dark);}

/* ── Form ── */
.form-section{padding:0 16px;}
.form-title{
  font-weight:800;font-size:15px;margin-bottom:12px;padding-top:16px;
  border-top:2px dashed var(--line);color:var(--ink);display:flex;align-items:center;gap:7px;
}
.field{margin-bottom:11px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:10px;font-size:14px;background:#fff;transition:.15s;
  color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(31,75,76,.1);
}
.field input.error{border-color:var(--danger);}
.field-err{font-size:11.5px;color:var(--danger);margin-top:4px;font-weight:700;}
.field textarea{resize:vertical;min-height:56px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px;}
.field-row .field{margin-bottom:0;}

.delivery-toggle{display:flex;gap:8px;margin-bottom:12px;}
.delivery-opt{
  flex:1;text-align:center;padding:10px 6px;border:2px solid var(--line);
  border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;
  background:#fff;transition:.15s;
}
.delivery-opt.active{background:var(--teal);border-color:var(--teal);color:#fff;}

/* ── Price breakdown ── */
.price-breakdown{
  background:#fff;border-radius:14px;border:1.5px solid var(--line);
  overflow:hidden;margin:0 0 8px;
}
.pb-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 14px;font-size:13.5px;font-weight:600;
}
.pb-row:not(:last-child){border-bottom:1px dashed var(--line);}
.pb-row.total{font-size:16px;font-weight:800;background:var(--teal-tint);color:var(--teal-dark);}
.pb-row .lbl{color:var(--ink-soft);}
.pb-row .val{font-weight:800;color:var(--ink);}
.pb-row.total .val{color:var(--teal);}

.fast-warning{display:none;background:var(--amber-tint);color:#7A5228;font-size:12px;font-weight:700;padding:9px;border-radius:9px;margin-bottom:8px;}
.form-msg{text-align:center;font-size:13px;font-weight:700;margin-bottom:10px;padding:10px;border-radius:10px;display:none;}
.form-msg.ok{display:block;background:var(--teal-tint);color:var(--teal-dark);}
.form-msg.err{display:block;background:var(--amber-tint);color:#A85A22;}

/* ── Sticky CTA ── */
.sticky-cta{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:#fff;border-top:2px solid var(--line);
  box-shadow:0 -6px 24px rgba(18,24,26,.1);
}
.sticky-cta .btn-order{
  width:100%;height:54px;border-radius:14px;
  background:linear-gradient(135deg,var(--amber) 0%,#c47a2a 100%);
  color:#12181A;font-size:17px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 14px rgba(224,138,60,.35);transition:.15s;
  border:none;cursor:pointer;font-family:inherit;
}
.sticky-cta .btn-order:active{transform:scale(.97);}
.sticky-cta .btn-order:disabled{opacity:.6;cursor:default;transform:none;}

/* ── Cross-sell ── */
.cs-section{
  margin:16px 0 0;padding:16px 16px 14px;
  background:linear-gradient(135deg,#f7f5f1 0%,#e8f3f3 100%);
  border-top:2px dashed var(--line);
}
.cs-title{font-size:16px;font-weight:800;color:var(--teal-dark);margin-bottom:14px;}
.cs-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.cs-row::-webkit-scrollbar{display:none;}
.cs-card{
  flex:0 0 140px;background:#fff;border-radius:14px;overflow:hidden;
  cursor:pointer;border:1.5px solid var(--line);
  box-shadow:0 2px 8px rgba(18,24,26,.07);transition:transform .15s;
}
.cs-card:active{transform:scale(.96);}
.cs-card-img{
  height:110px;background:var(--teal-tint);overflow:hidden;
}
.cs-card-img img{width:100%;height:100%;object-fit:cover;}
.cs-card-img .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;}
.cs-card-info{padding:9px 11px 11px;}
.cs-card-name{
  font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4;
  margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.cs-card-price{font-size:13.5px;font-weight:800;color:var(--teal);}

/* ── Success screen ── */
.success-screen{text-align:center;padding:36px 20px 28px;}
.success-screen .s-icon{font-size:64px;margin-bottom:12px;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes popIn{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.success-screen .s-title{font-size:22px;font-weight:800;color:var(--teal-dark);margin-bottom:6px;}
.success-screen .s-sub{font-size:14px;color:var(--ink-soft);line-height:1.7;margin-bottom:16px;}
.success-screen .s-summary{background:var(--teal-tint);border-radius:14px;padding:14px 16px;margin-bottom:16px;text-align:right;font-size:13.5px;line-height:2.1;}
.success-screen .s-summary strong{color:var(--teal-dark);}
.wa-btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:14px 28px;border-radius:14px;font-weight:800;text-decoration:none;font-size:15px;margin-top:4px;margin-bottom:8px;box-shadow:0 4px 14px rgba(37,211,102,.3);}
.continue-btn{display:block;margin-top:10px;color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;}

/* ── Description section (below form) ── */
.desc-section{
  margin:0;padding:20px 16px 4px;
  border-top:2px dashed var(--line);
}
.desc-section-title{
  font-size:15px;font-weight:800;color:var(--ink);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.desc-section-title::after{
  content:'';flex:1;height:2px;background:var(--teal-tint);border-radius:2px;
}
.desc-text{
  font-size:14px;color:var(--ink-soft);line-height:1.95;
  white-space:pre-line;margin-bottom:14px;
}
.features-list{list-style:none;margin-bottom:16px;}
.features-list li{
  font-size:13.5px;color:var(--ink-soft);
  padding:8px 0 8px 0;padding-inline-start:26px;
  position:relative;border-bottom:1px solid var(--line);line-height:1.6;
}
.features-list li:last-child{border-bottom:none;}
.features-list li::before{
  content:'✓';position:absolute;inset-inline-start:0;
  width:20px;height:20px;border-radius:50%;
  background:var(--teal);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;top:10px;
  line-height:1;text-align:center;
}

/* ── Skeleton ── */
.skel{background:linear-gradient(90deg,#eee,#f5f5f5,#eee);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <button class="topbar-back" id="backBtn" onclick="history.back()">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <a href="index.html" class="topbar-logo"><img src="MYLOGO.jpg" alt="QuickShop"></a>
  <span class="topbar-name" id="topbarName">QuickShop</span>
</div>

<!-- Main content — filled by JS -->
<div id="pageContent">
  <!-- Skeleton while loading -->
  <div style="aspect-ratio:4/3;background:var(--teal-tint);"></div>
  <div style="background:var(--teal);height:60px;"></div>
  <div style="padding:16px;">
    <div class="skel" style="height:22px;width:60%;margin-bottom:12px;"></div>
    <div class="skel" style="height:14px;margin-bottom:8px;"></div>
    <div class="skel" style="height:14px;width:80%;margin-bottom:8px;"></div>
  </div>
</div>

<!-- Sticky order button -->
<div class="sticky-cta" id="stickyCtaWrap">
  <button class="btn-order" id="stickyBtn" type="submit" form="orderForm">⚡ أكّد طلبك</button>
</div>

<script>
const SUPABASE_URL = "https://txlcppqnpoqnyjskevbh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4bGNwcHFucG9xbnlqc2tldmJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MDQzNTgsImV4cCI6MjEwMzE4MDM1OH0.pFCdNJXkUI981atVJJqavXo4EcMZu9XMOVAL-mkZ58Q";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function fmt(n){ return Number(n||0).toLocaleString('ar-DZ'); }
function esc(s){ return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''; }
function uid(){ return Date.now()+'_'+Math.random().toString(36).slice(2,8); }

// ── Get product ID from URL ──
const params = new URLSearchParams(location.search);
const PRODUCT_ID = params.get('id');

// ── State ──
let PRODUCT = null;
let ALL_PRODUCTS = [];
let SELECTED_VARIANT_LABELS = {}, SELECTED_VARIANT_PRICE = null, SELECTED_BUNDLE = null, QTY = 1;
let DELIVERY_TYPE = 'home';
let DELIVERY_SETTINGS = null;
let orderStartTime = 0;
let orderPlaced = false;

// ── Wilayas & Communes ──
const WILAYAS = ["أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة","تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة","سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","مسيلة","معسكر","ورقلة","وهران","البيض","إليزي","برج بوعريريج","بومرداس","الطارف","تندوف","تيسمسيلت","الوادي","خنشلة","سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تيموشنت","غرداية","غليزان","تيميمون","برج باجي مختار","أولاد جلال","بني عباس","عين صالح","عين قزام","تقرت","جانت","المغير","المنيعة"];
const COMMUNES_BY_WILAYA = {};

async function loadDeliverySettings(){
  try{
    const { data } = await sb.from('app_settings').select('delivery_price,delivery_price_stopdesk,delivery_by_wilaya,delivery_by_wilaya_stopdesk,phone,whatsapp').eq('id',1).single();
    if(!data) return {};
    return {
      defaultPrice: data.delivery_price!=null ? Number(data.delivery_price) : 400,
      defaultPriceStopdesk: data.delivery_price_stopdesk!=null ? Number(data.delivery_price_stopdesk) : 200,
      byWilaya: data.delivery_by_wilaya || {},
      byWilayaStopdesk: data.delivery_by_wilaya_stopdesk || {},
      phone: data.phone || '',
      whatsapp: data.whatsapp || ''
    };
  }catch(e){ return {defaultPrice:400,defaultPriceStopdesk:200,byWilaya:{},byWilayaStopdesk:{},phone:'',whatsapp:''}; }
}

function getDeliveryPrice(p, settings, wilayaName, type){
  if(type === 'bureau'){
    const custom = settings.byWilayaStopdesk && settings.byWilayaStopdesk[wilayaName];
    if(custom != null) return Number(custom);
    if(p.deliveryPriceStopdesk != null) return Number(p.deliveryPriceStopdesk);
    return settings.defaultPriceStopdesk != null ? Number(settings.defaultPriceStopdesk) : 200;
  }
  const custom = settings.byWilaya && settings.byWilaya[wilayaName];
  if(custom != null) return Number(custom);
  if(p.deliveryPrice != null) return Number(p.deliveryPrice);
  return settings.defaultPrice != null ? Number(settings.defaultPrice) : 400;
}

async function loadCommunes(wilayaName){
  if(COMMUNES_BY_WILAYA[wilayaName]) return COMMUNES_BY_WILAYA[wilayaName];
  try{
    const { data } = await sb.from('communes').select('name').eq('wilaya', wilayaName).order('name');
    const list = (data||[]).map(r=>r.name);
    COMMUNES_BY_WILAYA[wilayaName] = list;
    return list;
  }catch(e){ return []; }
}

// ── Gallery ──
let _imgs = [], _idx = 0;
function renderGallery(images, name){
  _imgs = images && images.length ? images : [];
  _idx = 0;
  const scroll = document.getElementById('gScroll');
  const dots = document.getElementById('gDots');
  const count = document.getElementById('gCount');
  if(!_imgs.length){
    scroll.innerHTML = `<div class="placeholder">🛍️</div>`;
    dots.style.display='none'; count.style.display='none';
    return;
  }
  scroll.innerHTML = _imgs.map((src,i)=>
    `<img src="${encodeURI(src)}" alt="${esc(name)} ${i+1}" loading="${i===0?'eager':'lazy'}">`
  ).join('');
  scroll.scrollLeft = 0;
  if(_imgs.length > 1){
    dots.style.display='flex';
    dots.innerHTML = _imgs.map((_,i)=>`<button class="${i===0?'active':''}" data-gi="${i}"></button>`).join('');
    dots.querySelectorAll('button').forEach(b=>b.onclick=()=>goSlide(Number(b.dataset.gi)));
    count.style.display='block';
    count.textContent=`1 / ${_imgs.length}`;
    // IntersectionObserver for swipe
    const io = new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          const idx = Array.from(scroll.querySelectorAll('img')).indexOf(entry.target);
          if(idx<0) return;
          _idx=idx;
          dots.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===idx));
          count.textContent=`${idx+1} / ${_imgs.length}`;
        }
      });
    },{root:scroll,threshold:0.6});
    scroll.querySelectorAll('img').forEach(img=>io.observe(img));
  } else { dots.style.display='none'; count.style.display='none'; }
}
function goSlide(i){
  _idx = Math.max(0,Math.min(i,_imgs.length-1));
  const scroll = document.getElementById('gScroll');
  scroll.scrollTo({left:_idx*scroll.clientWidth,behavior:'smooth'});
}

// ── Price & totals ──
function updatePrice(){
  const p = PRODUCT;
  const unitPrice = SELECTED_BUNDLE ? null : (SELECTED_VARIANT_PRICE!=null ? SELECTED_VARIANT_PRICE : p.priceNew);
  const displayPrice = SELECTED_BUNDLE ? SELECTED_BUNDLE.price : unitPrice;
  document.getElementById('pNow').textContent = fmt(displayPrice)+' دج';
  const pOld = document.getElementById('pOld');
  const pBadge = document.getElementById('pBadge');
  if(!SELECTED_BUNDLE && p.priceOld && p.priceOld > displayPrice){
    pOld.textContent = fmt(p.priceOld)+' دج'; pOld.style.display='inline';
    const pct = Math.round((1-displayPrice/p.priceOld)*100);
    pBadge.textContent=`-${pct}%`; pBadge.style.display='inline-block';
  } else { pOld.style.display='none'; pBadge.style.display='none'; }
  updateTotals();
}
function updateTotals(){
  const p = PRODUCT;
  const wilaya = document.getElementById('fWilaya')&&document.getElementById('fWilaya').value;
  const delPrice = (wilaya && DELIVERY_SETTINGS) ? getDeliveryPrice(p, DELIVERY_SETTINGS, wilaya, DELIVERY_TYPE) : null;
  const unitPrice = SELECTED_BUNDLE ? null : (SELECTED_VARIANT_PRICE!=null ? SELECTED_VARIANT_PRICE : p.priceNew);
  const prodTotal = SELECTED_BUNDLE ? SELECTED_BUNDLE.price : unitPrice*QTY;
  const pbProd = document.getElementById('pbProd');
  const pbDelLbl = document.getElementById('pbDelLbl');
  const pbDel = document.getElementById('pbDel');
  const pbTotal = document.getElementById('pbTotal');
  if(pbProd) pbProd.textContent = fmt(prodTotal)+' دج';
  if(pbDelLbl) pbDelLbl.textContent = DELIVERY_TYPE==='bureau' ? '📦 توصيل لمكتب البريد' : '🚚 توصيل للمنزل';
  if(pbDel) pbDel.textContent = delPrice!=null ? (delPrice>0?fmt(delPrice)+' دج':'مجاني 🎉') : '—';
  if(pbTotal) pbTotal.textContent = delPrice!=null ? fmt(prodTotal+delPrice)+' دج' : fmt(prodTotal)+' دج (+توصيل)';
}

// ── Variants ──
function renderVariants(p){
  const z = document.getElementById('variantsZone');
  if(!p.variants||!p.variants.length){z.innerHTML='';return;}
  z.innerHTML = p.variants.map((v,vi)=>`
    <div class="variant-block">
      <div class="variant-label">${esc(v.name)}</div>
      <div class="variant-opts">${(v.options||[]).map((o,oi)=>`
        <div class="variant-opt${o.outOfStock?' oos':''}" data-vi="${vi}" data-oi="${oi}" data-price="${o.price??''}">${esc(o.value)}</div>
      `).join('')}</div>
    </div>`).join('');
  z.querySelectorAll('.variant-opt:not(.oos)').forEach(opt=>{
    opt.addEventListener('click',()=>{
      const vi=Number(opt.dataset.vi);
      z.querySelectorAll(`.variant-opt[data-vi="${vi}"]`).forEach(x=>x.classList.remove('active'));
      opt.classList.add('active');
      SELECTED_VARIANT_LABELS[p.variants[vi].name] = opt.textContent;
      const priceStr=opt.dataset.price;
      SELECTED_VARIANT_PRICE = priceStr!==''?Number(priceStr):null;
      updatePrice();
    });
  });
}

// ── Bundles ──
function renderBundles(p){
  const z = document.getElementById('bundlesZone');
  if(!p.bundles||!p.bundles.length){z.innerHTML='';return;}
  z.innerHTML = `<div class="bundle-wrap">`+p.bundles.map((b,i)=>`
    <div class="bundle-opt${i===0?' active':''}" data-bi="${i}">
      <span>${esc(b.label)}</span><span>${fmt(b.price)} دج</span>
    </div>`).join('')+`</div>`;
  SELECTED_BUNDLE = p.bundles[0];
  z.querySelectorAll('.bundle-opt').forEach(el=>{
    el.addEventListener('click',()=>{
      z.querySelectorAll('.bundle-opt').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      SELECTED_BUNDLE = p.bundles[Number(el.dataset.bi)];
      updatePrice();
    });
  });
}

// ── Cross-sell ──
function renderCrossSell(){
  const z = document.getElementById('crossSellZone');
  let related = ALL_PRODUCTS.filter(x=>x.id!==PRODUCT.id&&x.category===PRODUCT.category&&x.active!==false);
  if(related.length<3) related = ALL_PRODUCTS.filter(x=>x.id!==PRODUCT.id&&x.active!==false);
  related = related.slice(0,8);
  if(!related.length){z.innerHTML='';return;}
  z.innerHTML=`<div class="cs-section">
    <div class="cs-title">✨ منتجات قد تعجبك</div>
    <div class="cs-row">
      ${related.map(r=>{
        const img=(r.images&&r.images[0])||r.image||'';
        return `<a class="cs-card" href="produit.html?id=${encodeURIComponent(r.id)}">
          <div class="cs-card-img">
            ${img?`<img src="${encodeURI(img)}" alt="${esc(r.name)}" loading="lazy">`:`<div class="placeholder">🛍️</div>`}
          </div>
          <div class="cs-card-info">
            <div class="cs-card-name">${esc(r.name)}</div>
            <div class="cs-card-price">${fmt(r.priceNew)} دج</div>
          </div>
        </a>`;
      }).join('')}
    </div>
  </div>`;
}

// ── WA link ──
function buildWALink(order){
  if(!DELIVERY_SETTINGS||(!(DELIVERY_SETTINGS.whatsapp)&&!(DELIVERY_SETTINGS.phone))) return '#';
  const phone=(DELIVERY_SETTINGS.whatsapp||DELIVERY_SETTINGS.phone||'').replace(/\D/g,'');
  const msg=encodeURIComponent(`🛍️ طلب جديد — QuickShop\n📦 ${order.product_name}\n👤 ${order.name}\n📞 ${order.phone}\n📍 ${order.wilaya} / ${order.commune||''}\n💰 ${fmt(order.total)} دج\n🚚 ${order.delivery_type==='stopdesk'?'مكتب البريد':'للمنزل'}`);
  return `https://wa.me/${phone}?text=${msg}`;
}

// ── Render full page ──
function renderPage(p){
  document.title = `${p.name} — QuickShop`;
  document.getElementById('topbarName').textContent = p.name;
  const imgs = (p.images&&p.images.length)?p.images:(p.image?[p.image]:[]);

  document.getElementById('pageContent').innerHTML=`
    <!-- Gallery -->
    <div class="gallery-wrap">
      <div class="gallery-scroll" id="gScroll" dir="ltr"></div>
      <div class="gallery-dots" id="gDots" style="display:none;"></div>
      <div class="gallery-count" id="gCount" style="display:none;"></div>
    </div>

    <!-- Price hero -->
    <div class="price-hero">
      <div>
        <span class="p-now" id="pNow">—</span>
        <span class="p-old" id="pOld" style="display:none;"></span>
      </div>
      <span class="p-badge" id="pBadge" style="display:none;"></span>
    </div>

    <!-- Info: badge + name only (description moves below form) -->
    <div class="info">
      ${p.badge?`<span class="product-badge">${esc(p.badge)}</span>`:''}
      <div class="product-name">${esc(p.name)}</div>
    </div>

    <!-- Variants -->
    <div id="variantsZone"></div>

    <!-- Qty -->
    <div class="qty-wrap">
      <div class="qty-row">
        <span class="qty-label">الكمية</span>
        <div class="qty-ctrl">
          <button class="qty-btn" id="qtyMinus">−</button>
          <span class="qty-val" id="qtyVal">1</span>
          <button class="qty-btn" id="qtyPlus">+</button>
        </div>
      </div>
    </div>

    <!-- Bundles -->
    <div id="bundlesZone"></div>

    <!-- Order form -->
    <div class="form-section">
      <div class="form-title">🛒 اطلب الآن — الدفع عند الاستلام</div>
      <form id="orderForm" autocomplete="on">
        <!-- Honeypot: bots fill this, humans don't see it -->
        <div style="position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden;" aria-hidden="true">
          <input type="text" name="website" id="fHoneypot" tabindex="-1" autocomplete="off">
        </div>
        <div class="field">
          <label>الاسم الكامل</label>
          <input type="text" id="fName" required placeholder="محمد أمين..." autocomplete="name">
        </div>
        <div class="field">
          <label>رقم الهاتف</label>
          <input type="tel" id="fPhone" required placeholder="05XXXXXXXX" autocomplete="tel">
          <div class="field-err" id="phoneErr" style="display:none;"></div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>الولاية</label>
            <select id="fWilaya" required><option value="">اختر</option></select>
          </div>
          <div class="field">
            <label>البلدية</label>
            <select id="fCommune" required><option value="">اختر</option></select>
          </div>
        </div>
        <div class="delivery-toggle" id="deliveryToggle">
          <div class="delivery-opt active" data-type="home">🏠 للمنزل</div>
          <div class="delivery-opt" data-type="bureau">📦 مكتب البريد</div>
        </div>
        <div class="field">
          <label>ملاحظات (اختياري)</label>
          <textarea id="fNotes" placeholder="لون، مقاس، أو أي ملاحظة..."></textarea>
        </div>
        <!-- Price breakdown -->
        <div class="price-breakdown">
          <div class="pb-row"><span class="lbl">💰 سعر المنتج</span><span class="val" id="pbProd">—</span></div>
          <div class="pb-row"><span class="lbl" id="pbDelLbl">🚚 توصيل للمنزل</span><span class="val" id="pbDel">—</span></div>
          <div class="pb-row total"><span>المجموع الكلي</span><span id="pbTotal">—</span></div>
        </div>
        <div class="fast-warning" id="fastWarning">⚠️ أكملت النموذج بسرعة — تأكد من صحة البيانات</div>
        <div class="form-msg" id="formMsg"></div>
      </form>
    </div>

    <!-- Description & features (below order form) -->
    ${(p.description||p.features&&p.features.length)?`
    <div class="desc-section">
      <div class="desc-section-title">📋 تفاصيل المنتج</div>
      ${p.description?`<div class="desc-text">${esc(p.description)}</div>`:''}
      ${p.features&&p.features.length?`<ul class="features-list">${p.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    </div>`:''}

    <!-- Cross-sell -->
    <div id="crossSellZone"></div>
  `;

  renderGallery(imgs, p.name);
  renderVariants(p);
  renderBundles(p);
  updatePrice();
  renderCrossSell();

  // Wilaya dropdown
  const wilayaSel = document.getElementById('fWilaya');
  wilayaSel.innerHTML = '<option value="">اختر الولاية</option>'+WILAYAS.map(w=>`<option>${esc(w)}</option>`).join('');
  wilayaSel.addEventListener('change', async function(){
    const communeSel = document.getElementById('fCommune');
    communeSel.innerHTML = '<option value="">جاري التحميل...</option>';
    const list = await loadCommunes(this.value);
    communeSel.innerHTML = '<option value="">اختر البلدية</option>'+list.map(c=>`<option>${esc(c)}</option>`).join('');
    updateTotals();
  });

  // Delivery toggle
  document.getElementById('deliveryToggle').querySelectorAll('.delivery-opt').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('.delivery-opt').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      DELIVERY_TYPE = el.dataset.type;
      updateTotals();
    });
  });

  // Qty
  document.getElementById('qtyMinus').addEventListener('click',()=>{
    if(QTY>1){ QTY--; document.getElementById('qtyVal').textContent=QTY; updateTotals(); }
  });
  document.getElementById('qtyPlus').addEventListener('click',()=>{
    if(QTY<10){ QTY++; document.getElementById('qtyVal').textContent=QTY; updateTotals(); }
  });

  // Form submit
  document.getElementById('orderForm').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const btn = document.getElementById('stickyBtn');
    const name = document.getElementById('fName').value.trim();
    const phone = document.getElementById('fPhone').value.trim().replace(/\s+/g,'');
    const wilaya = document.getElementById('fWilaya').value;
    const commune = document.getElementById('fCommune').value;
    const notes = document.getElementById('fNotes').value.trim();
    const msg = document.getElementById('formMsg');

    // Phone validation
    const phoneClean = phone.replace(/\D/g,'');
    if(phoneClean.length<9||!phoneClean.match(/^(05|06|07)/)){
      document.getElementById('fPhone').classList.add('error');
      document.getElementById('phoneErr').style.display='block';
      document.getElementById('phoneErr').textContent='رقم الهاتف غير صحيح';
      return;
    }
    document.getElementById('fPhone').classList.remove('error');
    document.getElementById('phoneErr').style.display='none';

    // Honeypot check (bots fill hidden field)
    if(document.getElementById('fHoneypot').value){ return; }

    // Speed check
    const elapsed = (Date.now()-orderStartTime)/1000;
    if(elapsed<8){
      document.getElementById('fastWarning').style.display='block';
      setTimeout(()=>{ document.getElementById('fastWarning').style.display='none'; }, 4000);
      return;
    }

    if(!wilaya){ msg.className='form-msg err'; msg.textContent='الرجاء اختيار الولاية'; return; }

    btn.disabled=true; btn.textContent='⏳ جاري التحقق...';

    // Anti-fraud check
    const fraud = await checkFraud(phoneClean);
    if(!fraud.ok){
      btn.disabled=false; btn.textContent='⚡ أكّد طلبك';
      msg.className='form-msg err'; msg.textContent=fraud.reason;
      return;
    }

    btn.textContent='⏳ جاري الإرسال...';
    const unitPrice = SELECTED_BUNDLE ? null : (SELECTED_VARIANT_PRICE!=null?SELECTED_VARIANT_PRICE:p.priceNew);
    const productTotal = SELECTED_BUNDLE ? SELECTED_BUNDLE.price : unitPrice*QTY;
    const deliveryPrice = DELIVERY_SETTINGS ? getDeliveryPrice(p, DELIVERY_SETTINGS, wilaya, DELIVERY_TYPE) : 400;
    const order = {
      id: uid(),
      product_id: p.id, product_name: p.name,
      product_image: imgs[0]||'',
      name, phone: phoneClean, wilaya, commune, notes,
      qty: QTY,
      variant: Object.values(SELECTED_VARIANT_LABELS).pop()||null,
      bundle: SELECTED_BUNDLE?.label||null,
      delivery_type: DELIVERY_TYPE==='bureau'?'stopdesk':DELIVERY_TYPE,
      delivery_price: deliveryPrice,
      total: productTotal+deliveryPrice,
      status:'new', source:'web',
      client_ip: CLIENT_IP||null,
      created_at: Date.now()
    };
    try{
      const { error } = await sb.from('orders').insert([order]);
      if(error) throw error;
      orderPlaced=true;
      showSuccess(order);
    }catch(err){
      btn.disabled=false; btn.textContent='⚡ أكّد طلبك';
      msg.className='form-msg err'; msg.textContent='حدث خطأ، حاول مرة أخرى';
    }
    orderStartTime = Date.now();
  });

  orderStartTime = Date.now();
}

document.addEventListener('contextmenu', e => {
  if(e.target.tagName==='IMG') e.preventDefault();
});
document.addEventListener('dragstart', e => {
  if(e.target.tagName==='IMG') e.preventDefault();
});

// ── Fetch client IP (used for fraud logging) ──
let CLIENT_IP = null;
(async()=>{
  try{
    const r = await fetch('https://api.ipify.org?format=json', {cache:'no-store'});
    const j = await r.json();
    CLIENT_IP = j.ip||null;
  }catch(e){ CLIENT_IP = null; }
})();

// ── Anti-fraud: check phone rate-limit before submitting ──
async function checkFraud(phoneClean){
  // 1. Honeypot: already checked in form via hidden field
  // 2. Phone rate-limit: max 3 orders from same phone in last 60 min
  const oneHourAgo = Date.now() - 60*60*1000; // bigint ms
  const { data, error } = await sb.from('orders')
    .select('id', {count:'exact'})
    .eq('phone', phoneClean)
    .gte('created_at', oneHourAgo);
  if(error) return { ok:true }; // fail open
  if((data||[]).length >= 3){
    return { ok:false, reason:'تم تسجيل عدة طلبات من هذا الرقم مؤخرًا. الرجاء المحاولة لاحقًا.' };
  }
  // 3. IP rate-limit: max 5 orders from same IP in last 60 min
  if(CLIENT_IP){
    const { data: ipData } = await sb.from('orders')
      .select('id', {count:'exact'})
      .eq('client_ip', CLIENT_IP)
      .gte('created_at', oneHourAgo);
    if((ipData||[]).length >= 5){
      return { ok:false, reason:'نشاط مريب من هذا الجهاز. الرجاء المحاولة لاحقًا.' };
    }
  }
  return { ok:true };
}

// ── Init ──
async function init(){
  if(!PRODUCT_ID){
    document.getElementById('pageContent').innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--ink-soft)"><div style="font-size:48px;margin-bottom:16px;">😕</div><div style="font-size:16px;">المنتج غير موجود</div><a href="index.html" style="color:var(--teal);font-weight:700;display:block;margin-top:12px;">← العودة للمتجر</a></div>`;
    document.getElementById('stickyCtaWrap').style.display='none';
    return;
  }
  // Load product + delivery + all products in parallel
  const [delSettings, { data: prodData }, { data: allData }] = await Promise.all([
    loadDeliverySettings(),
    sb.from('products').select('*').eq('id', PRODUCT_ID).single(),
    sb.from('products').select('*').order('created_at',{ascending:false})
  ]);
  DELIVERY_SETTINGS = delSettings;
  ALL_PRODUCTS = (allData||[]).map(rowToProduct);

  if(!prodData){
    document.getElementById('pageContent').innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--ink-soft)"><div style="font-size:48px;margin-bottom:16px;">😕</div><div style="font-size:16px;">المنتج غير موجود</div><a href="index.html" style="color:var(--teal);font-weight:700;display:block;margin-top:12px;">← العودة للمتجر</a></div>`;
    document.getElementById('stickyCtaWrap').style.display='none';
    return;
  }
  PRODUCT = rowToProduct(prodData);
  renderPage(PRODUCT);
}

function rowToProduct(r){
  return {
    id:r.id, name:r.name, category:r.category,
    priceNew:Number(r.price_new), priceOld:r.price_old!=null?Number(r.price_old):null,
    badge:r.badge, image:r.image,
    images:r.images||(r.image?[r.image]:[]),
    description:r.description||'',
    features:r.features||[],
    variants:r.variants||[],
    bundles:r.bundles||[],
    active:r.active!==false,
    deliveryPrice:r.delivery_price!=null?Number(r.delivery_price):null,
    deliveryPriceStopdesk:r.delivery_price_stopdesk!=null?Number(r.delivery_price_stopdesk):null,
    createdAt:r.created_at
  };
}

init();
